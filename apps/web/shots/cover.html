<!doctype html>
<!--
  The cover (1280×640, GitHub's social preview size): the name, what it does,
  and the light review screenshot, which shots.spec.ts puts into the img.
  The app's colours (Tailwind's stone and teal).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1280px; height: 640px; overflow: hidden; }
      body {
        background: #fafaf9;
        color: #1c1917;
        font-family: ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 440px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
      }
      h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
      h1 span { color: #0f766e; }
      p { font-size: 26px; line-height: 1.35; color: #44403c; }
      .note { font-size: 18px; color: #78716c; display: flex; gap: 10px; align-items: center; }
      .note b { width: 8px; height: 8px; border-radius: 50%; background: #2dd4bf; }
      .ripples {
        position: absolute;
        left: -180px;
        bottom: -260px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #ccfbf1, 0 0 0 60px #fafaf9, 0 0 0 61px #ccfbf1, 0 0 0 120px #fafaf9, 0 0 0 121px #ccfbf1;
      }
      .shot {
        position: absolute;
        left: 560px;
        top: 72px;
        width: 900px;
        border-radius: 14px;
        border: 1px solid #e7e5e4;
        box-shadow: 0 30px 60px -20px rgb(28 25 23 / 0.35);
        overflow: hidden;
      }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="ripples"></div>
    <div class="text">
      <h1><span>ripple</span>-review</h1>
      <p>Review a pull request in order: from its core outwards to the code that uses it.</p>
      <div class="note"><b></b> Runs in your browser, no server</div>
    </div>
    <div class="shot"><img src="data:image/png;base64,{{review}}" alt="" /></div>
  </body>
</html>
